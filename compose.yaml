name: coder

services:
  coder:
    image: ${CODER_REPO}:${CODER_VERSION}
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:80"
    environment:
      CODER_PG_CONNECTION_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database/${POSTGRES_DB}?sslmode=disable"
      CODER_HTTP_ADDRESS: "0.0.0.0:80"
      CODER_ACCESS_URL: "${CODER_ACCESS_URL}"
      CODER_EXTERNAL_AUTH_0_ID: "${CODER_EXTERNAL_AUTH_0_ID}"
      CODER_EXTERNAL_AUTH_0_TYPE: "${CODER_EXTERNAL_AUTH_0_TYPE}"
      CODER_EXTERNAL_AUTH_0_CLIENT_ID: "${CODER_EXTERNAL_AUTH_0_CLIENT_ID}"
      CODER_EXTERNAL_AUTH_0_CLIENT_SECRET: "${CODER_EXTERNAL_AUTH_0_CLIENT_SECRET}"
      CODER_EXTERNAL_AUTH_0_DISPLAY_NAME: "${CODER_EXTERNAL_AUTH_0_DISPLAY_NAME}"
    group_add:
      - "${DOCKER_GROUP_ID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      database:
        condition: service_healthy
  
  database:
    # Minimum supported version is 13.
    # More versions here: https://hub.docker.com/_/postgres
    image: "postgres:17"
    restart: unless-stopped
    #ports:
    #  - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
